<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🎙️ Meeting Recorder</h2>
    </div>
    
    <div class="input-group">
      <label for="meetingTitle">Meeting Title (optional)</label>
      <input type="text" id="meetingTitle" placeholder="e.g., Client Strategy Call" />
    </div>
    
    <div class="button-group">
      <button id="startBtn" class="btn start">
        <span class="icon">🔴</span>
        Start Recording
      </button>
      <button id="stopBtn" class="btn stop" disabled>
        <span class="icon">⏹️</span>
        Stop & Upload
      </button>
    </div>
    
    <div id="status" class="status"></div>
    
    <div id="forceStopContainer" class="force-stop-container" style="display: none;">
      <button id="forceStopBtn" class="btn-link">🔧 Force Stop (if stuck)</button>
    </div>
    
    <div class="footer">
      <small>Transcripts → <a href="https://github.com/dataappengineer/ctrl-shift-call-transcripts" target="_blank">GitHub</a></small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
